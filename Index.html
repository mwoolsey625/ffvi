<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FFVI Run">
<meta name="theme-color" content="#0E1733">
<title>FFVI PR — Perfect Stats + Full Bestiary</title>
<style>
:root{
  --field:#0E1733; --panel:#16224A; --panel2:#1C2A58;
  --rule:#4C6BB0; --rule-dim:#2B3D6E;
  --ink:#EEF2FF; --ink-dim:#93A4D4;
  --magicite:#B98CE8; --sealed:#54BE9A; --warn:#E8B15C;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--field)}
body{
  color:var(--ink);font-family:var(--mono);font-size:14px;line-height:1.5;
  padding:calc(14px + env(safe-area-inset-top)) 12px calc(56px + env(safe-area-inset-bottom));
  max-width:760px;margin:0 auto;-webkit-text-size-adjust:100%;
}
header{border-bottom:1px solid var(--rule);padding-bottom:12px;margin-bottom:14px}
.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--magicite);margin-bottom:6px}
h1{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:0 0 10px}
.bar{height:5px;background:var(--rule-dim);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--magicite);width:0;transition:width .35s ease}
.count{font-size:11px;color:var(--ink-dim);margin-top:6px;letter-spacing:.05em}

nav{display:flex;gap:5px;margin-bottom:16px}
nav button{
  flex:1;min-height:40px;padding:9px 2px;background:transparent;color:var(--ink-dim);
  border:1px solid var(--rule-dim);border-radius:3px;font-family:var(--mono);
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;
}
nav button[aria-selected="true"]{background:var(--panel2);color:var(--ink);border-color:var(--rule)}
button:focus-visible,summary:focus-visible{outline:2px solid var(--magicite);outline-offset:2px}

.phase{margin-bottom:26px}
.phase-name{font-size:13px;font-weight:700;letter-spacing:.04em;margin-bottom:3px}
.phase-note{font-size:11px;color:var(--ink-dim);margin-bottom:12px}

.gate{border:1px solid var(--rule-dim);border-radius:4px;margin-bottom:8px;background:var(--panel);overflow:hidden}
.gate.sealed{border-color:var(--sealed);background:var(--field)}
.gate-head{
  width:100%;display:flex;align-items:center;gap:9px;padding:12px;min-height:46px;
  background:transparent;border:0;color:inherit;font-family:var(--mono);font-size:13px;
  text-align:left;cursor:pointer;
}
.chev{color:var(--ink-dim);font-size:10px;width:9px;flex:none}
.gate-title{flex:1;font-weight:600}
.gate.sealed .gate-title{color:var(--ink-dim);text-decoration:line-through;text-decoration-color:var(--rule-dim)}
.stamp{font-size:9px;letter-spacing:.16em;padding:2px 6px;border-radius:2px;border:1px solid var(--sealed);color:var(--sealed);flex:none}
.tally{font-size:10px;color:var(--ink-dim);flex:none;letter-spacing:.06em}
.gbody{padding:0 12px 12px;border-top:1px solid var(--rule-dim)}
.seal-line{font-size:10px;color:var(--ink-dim);letter-spacing:.05em;padding:9px 0 2px}
.seal-line b{color:var(--warn);font-weight:600}
.warn{font-size:11px;color:var(--warn);border-left:2px solid var(--warn);padding:5px 0 5px 9px;margin:8px 0 4px;line-height:1.45}
.item{
  width:100%;display:flex;align-items:flex-start;gap:9px;padding:9px 0;min-height:40px;
  background:transparent;border:0;border-top:1px solid var(--rule-dim);color:var(--ink);
  font-family:var(--mono);font-size:12.5px;text-align:left;cursor:pointer;
}
.box{width:15px;height:15px;flex:none;margin-top:1px;border:1px solid var(--rule);border-radius:2px;
  display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--field)}
.item.on .box{background:var(--sealed);border-color:var(--sealed)}
.item.on span:last-child{color:var(--ink-dim);text-decoration:line-through;text-decoration-color:var(--rule-dim)}

table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--magicite);
  font-weight:600;padding:0 8px 7px 0;border-bottom:1px solid var(--rule)}
td{padding:9px 8px 9px 0;border-bottom:1px solid var(--rule-dim);vertical-align:top}
.nm{font-weight:600;white-space:nowrap}
.sub{display:block;font-size:10.5px;color:var(--ink-dim);margin-top:2px;line-height:1.4;white-space:normal}
.dual{color:var(--magicite);font-weight:700}
.skip{color:var(--ink-dim)}

.card{border:1px solid var(--rule-dim);border-radius:4px;padding:13px;background:var(--panel);margin-bottom:14px}
.card h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--magicite);margin:0 0 9px;font-weight:600}
.p{font-size:12px;color:var(--ink-dim);line-height:1.6;margin:0 0 8px}
.p:last-child{margin-bottom:0}
.p b{color:var(--ink);font-weight:600}
.seg{padding:8px 12px;min-height:38px;background:transparent;border:1px solid var(--rule-dim);
  color:var(--ink-dim);font-family:var(--mono);font-size:11px;cursor:pointer;border-radius:3px}
.seg.on{background:var(--panel2);color:var(--ink);border-color:var(--magicite)}
.row{display:flex;align-items:center;gap:8px;margin-top:8px}
.row>span{width:52px;font-size:12px;font-weight:600}

details{border:1px solid var(--rule-dim);border-radius:4px;margin-bottom:8px;background:var(--panel)}
summary{padding:12px;cursor:pointer;font-size:13px;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▶ ";color:var(--ink-dim);font-size:10px}
details[open] summary::before{content:"▼ "}
details[open] summary{border-bottom:1px solid var(--rule-dim)}
.doc{padding:12px;font-size:12.5px;line-height:1.65;color:var(--ink-dim)}
.doc h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--magicite);margin:16px 0 7px;font-weight:600}
.doc h4:first-child{margin-top:0}
.doc p{margin:0 0 9px}
.doc b{color:var(--ink)}
.doc ul{margin:0 0 9px;padding-left:17px}
.doc li{margin-bottom:5px}
.doc code{background:var(--panel2);padding:1px 5px;border-radius:2px;font-size:11.5px;color:var(--ink)}
.doc .flag{color:var(--warn)}

.tools{margin-top:24px;display:flex;flex-wrap:wrap;gap:8px}
.tools button{padding:10px 13px;min-height:40px;background:transparent;border:1px solid var(--rule-dim);
  color:var(--ink-dim);font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;border-radius:3px;cursor:pointer}
#io{width:100%;margin-top:10px;background:var(--field);color:var(--ink);border:1px solid var(--rule-dim);
  border-radius:3px;padding:9px;font-family:var(--mono);font-size:11px;min-height:70px;display:none}
.msg{font-size:11px;color:var(--sealed);margin-top:9px;min-height:15px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  <div class="eyebrow">FFVI Pixel Remaster · Perfect Stats + Full Bestiary</div>

/* ---------- state ---------- */
var S={checked:{},terra:"Magic",celes:"Strength"},tab="gates",open={};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);S.checked=p.checked||{};S.terra=p.terra||"Magic";S.celes=p.celes||"Strength";}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){note("Storage blocked — use Back up progress.");}}
function note(t){var m=document.getElementById("msg");m.textContent=t;if(t)setTimeout(function(){if(m.textContent===t)m.textContent="";},4000);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

function allKeys(){var a={};PHASES.forEach(function(p){p.gates.forEach(function(g){g.items.forEach(function(it,i){a[itemKey(g,it,i)]=1;});});});return Object.keys(a);}

/* Items written as "Label|N" share storage with bestiary entry N, so ticking
   one view ticks the other. Unlinked items keep a gate-local key. */
function itemKey(g,it,i){var p=String(it).split("|");return p[1]?"b:"+p[1]:g.id+":"+i;}
function itemLabel(it){return String(it).split("|")[0];}
function itemNum(it){var p=String(it).split("|");return p[1]||"";}
function progress(){var k=allKeys(),d=0;k.forEach(function(x){if(S.checked[x])d++;});return{d:d,t:k.length};}

/* ---------- render ---------- */
function renderHead(){
  var p=progress(),pct=p.t?Math.round(p.d/p.t*100):0;
  document.getElementById("fill").style.width=pct+"%";
  document.getElementById("count").textContent=p.d+" / "+p.t+" requirements cleared · "+pct+"%";
}

function gatesHTML(){
  var h="";
  PHASES.forEach(function(ph){
    h+='<section class="phase"><div class="phase-name">'+esc(ph.name)+'</div><div class="phase-note">'+esc(ph.note)+'</div>';
    ph.gates.forEach(function(g){
      var done=0;g.items.forEach(function(it,i){if(S.checked[itemKey(g,it,i)])done++;});
      var sealed=done===g.items.length,isOpen=!!open[g.id];
      h+='<div class="gate'+(sealed?" sealed":"")+'">';
      h+='<button class="gate-head" data-gate="'+g.id+'" aria-expanded="'+isOpen+'">';
      h+='<span class="chev">'+(isOpen?"▼":"▶")+'</span><span class="gate-title">'+esc(g.title)+'</span>';
      h+=sealed?'<span class="stamp">SEALED</span>':'<span class="tally">'+done+"/"+g.items.length+'</span>';
      h+='</button>';
      if(isOpen){
        h+='<div class="gbody"><div class="seal-line">Closes on: <b>'+esc(g.seal)+'</b></div>';
        if(g.warn)h+='<div class="warn">'+esc(g.warn)+'</div>';
        g.items.forEach(function(it,i){
          var k=itemKey(g,it,i),on=!!S.checked[k],num=itemNum(it);
          h+='<button class="item'+(on?" on":"")+'" data-key="'+k+'" aria-pressed="'+on+'"><span class="box">'+(on?"✓":"")+'</span><span>'+esc(itemLabel(it))
           +(num?' <span style="color:var(--magicite);font-size:10px">#'+num+'</span>':"")+'</span></button>';
        });
        h+='</div>';
      }
      h+='</div>';
    });
    h+='</section>';
  });
  return h;
}

function levelsHTML(){
  var h='<div class="card"><h3>Role split</h3><p class="p">Terra and Celes both work either way. Raising one as each avoids duplicating a role.</p>';
  [["terra","Terra",S.terra],["celes","Celes",S.celes]].forEach(function(r){
    h+='<div class="row"><span>'+r[1]+'</span>';
    ["Magic","Strength"].forEach(function(s){
      h+='<button class="seg'+(r[2]===s?" on":"")+'" data-role="'+r[0]+'" data-val="'+s+'">'+s+'</button>';
    });
    h+='</div>';
  });
  h+='</div>';
  h+='<div class="card"><h3>Windows</h3>'
   +'<p class="p"><b>HP — Bahamut (+50%).</b> Equip after gaining 68, remove after gaining 71. Three levels.</p>'
   +'<p class="p"><b>MP — Crusader (+50%).</b> Equip after gaining 47, remove after gaining 50. Extra levels sit on either side.</p>'
   +'<p class="p"><b>Combat stats are +2 per level and hard-cap at 128.</b> Swap espers the moment one caps — further levels under it are wasted.</p></div>';
  h+='<table><thead><tr><th>Character</th><th>Stat</th><th>Crusader</th><th>Bahamut</th></tr></thead><tbody>';
  ROSTER.forEach(function(c){
    var dual=c.stat==="DUAL";
    var st=c.stat==="role-terra"?S.terra:c.stat==="role-celes"?S.celes:dual?"Str + Mag":c.stat;
    h+='<tr><td class="nm">'+esc(c.name)+(c.note?'<span class="sub">'+esc(c.note)+'</span>':"")+'</td>';
    h+='<td class="'+(dual?"dual":"")+'">'+esc(st)+'</td>';
    h+='<td class="'+(dual?"skip":"")+'">'+(dual?"skip":MP[c.name]+" lv")+'</td>';
    h+='<td class="'+(dual?"skip":"")+'">'+(dual?"skip":"69–71")+'</td></tr>';
  });
  h+='</tbody></table>';
  h+='<div class="card" style="margin-top:14px"><h3>Why Gau skips</h3>'
   +'<p class="p">Dual-capping needs roughly 99 levels against his ~92. HP/MP maxing would cost another seven, so it is the first thing to cut. Expect to land slightly short on one side — the route commits his first ~19 levels to Zona Seeker, so Strength is the backfill.</p>'
   +'<p class="p">Everyone else has 37–52 spare levels after capping their primary. For them the HP and MP windows are free.</p></div>';
  return h;
}

function ragesHTML(){
  var h='<div class="card"><h3>Front-load these</h3><p class="p">A full bestiary means fighting nearly every formation, which crowds the Veldt. Get the combat-critical Rages before that happens — everything else is opportunistic.</p>'
   +'<p class="p">The Veldt only replays formations you have already fought, so it cleans up nothing you skipped in the field.</p></div>';
  h+='<div class="card"><h3 style="color:var(--warn)">Stray Cat — hard window</h3>'
   +'<p class="p"><b>Missable.</b> Lost permanently if never encountered in the World of Balance. Fight one on the <b>Doma region overworld</b> during Sabin\'s scenario; it then becomes available on the Veldt as soon as Gau joins.</p>'
   +'<p class="p">Cat Scratch deals <b>quadruple damage</b> to a single target — his strongest physical Rage. Simmeh skips it only because no boss in his route requires it.</p>'
   +'<p class="p">Veldt formations: <b>group 7</b> slots 1 (Stray Cat x3), 2 and 6, plus <b>group 8</b> slot 1. The x3 formation in group 7 is the cleanest target.</p></div>';
  h+='<div class="card"><h3>How the Veldt actually picks</h3>'
   +'<p class="p">Groups run 1 → 64 and then wrap. Each battle advances you one group. Within a group the game rolls 0–7; <b>if you have not encountered that formation it moves to the next slot</b> until it finds one you have. Groups where you know nothing are skipped entirely.</p>'
   +'<p class="p"><b>This is exactly why a full bestiary makes Rage hunting harder.</b> While a group has only one formation you know, every roll collapses onto it. Once you have filled all eight slots, it becomes a true 1-in-8. Get the Rages you need from a group <i>before</i> you finish filling that group in.</p>'
   +'<p class="p">The old <b>reload-advances-13-groups</b> trick is a SNES/PlayStation behaviour. Later versions randomise the group on reload instead, so manipulation guides written for those versions may not transfer — test before relying on it.</p></div>';
  h+='<table><thead><tr><th>Rage</th><th>Source</th><th>Ability</th></tr></thead><tbody>';
  RAGES.forEach(function(r){
    var k="rage:"+r.n,on=!!S.checked[k],o=on?';opacity:.5':"";
    h+='<tr data-key="'+k+'" style="cursor:pointer"><td class="nm" style="'+o.slice(1)+'">'
     +'<span style="color:'+(on?"var(--sealed)":"var(--rule)")+'">'+(on?"✓ ":"□ ")+'</span>'+esc(r.n)
     +(r.m?' <span style="color:var(--warn);font-size:9px;letter-spacing:.1em">WOB ONLY</span>':"")
     +'<span class="sub">'+esc(r.w)+'</span></td>'
     +'<td style="'+o.slice(1)+'">'+esc(r.g)+'</td><td style="'+o.slice(1)+'">'+esc(r.a)+'</td></tr>';
  });
  return h+'</tbody></table>';
}

function notesHTML(){
  return ''
+'<details open><summary>Route merge — how this run differs</summary><div class="doc">'
+'<h4>What this reconciles</h4>'
+'<p>Two guides that were never written to work together. <b>Simmeh\'s Low Level/Perfect Stats Walkthrough</b> (Steam) gives boss strategy and level discipline but explicitly disclaims bestiary coverage. <b>bover_87\'s Missable Item Walkthrough</b> (GameFAQs) gives the cutoffs but knows nothing about level-locking. Where one says skip and the other says kill, the Gates tab already resolves it.</p>'
+'<h4>The core reframe</h4>'
+'<p>Simmeh keeps encounters <b>off</b> all game to limit Veldt entropy so Gau\'s Rages stay findable. A full bestiary wants the opposite. Accept the congested Veldt — it is the price of the run. Mitigate by front-loading the eight Rages on the Rages tab.</p>'
+'<p>With EXP at 0x, extra combat is <b>free</b>. Nothing about fighting more threatens the stat plan during Phase I. The threat is dying at level 5.</p>'
+'<h4>Phase I survival pattern</h4>'
+'<p>Gobbledygook Rage to Vanish the party, or the Phantom esper once you have it. An Invisible party is immune to physicals, which trivialises most low-level grinding. Simmeh uses this only for Number 024 and the Esper Cave — use it far more broadly.</p>'
+'<h4>The three traps that matter most</h4>'
+'<ul>'
+'<li><b>Cave to the Sealed Gate.</b> Simmeh says to waltz through with encounters off because there are no Rages worth having. That cave hard-locks five entries plus the Ultima Weapon, Heiji\'s Jitte and Kazekiri #2 when you board at Albrook.</li>'
+'<li><b>Air Force.</b> His PSG strategy is two Thundaras on the main body, which ends the fight before Bit ever spawns. Bit never appears again.</li>'
+'<li><b>Naude.</b> Must be killed, not merely forced to flee. Imp is the standard clear and it makes them run, registering nothing. Six-minute timer, and Celes is force-joined — so level her before ascending past Ultima Weapon.</li>'
+'</ul>'
+'<h4>Best synergy</h4>'
+'<p>The Floating Continent. Simmeh\'s low-level advice is to flee Ninjas and Dragons on sight, but in a PSG you arrive with a level-26 Gau. The eight required entries fold into the same trip where you are already farming to level Shadow and your Break-caster.</p>'
+'<h4>Verification tool</h4>'
+'<p>The <b>main-menu</b> bestiary — not the in-game one — has a Display Map that puts a <b>?</b> marker on any location with unregistered entries. Run it before every gate, especially the end-of-Act-I audit.</p>'
+'<p>Registration rule: a monster generally must be <b>defeated</b> to enter the bestiary. Fleeing is enough for Veldt appearance but not for the entry.</p>'
+'<h4 class="flag">No safety net in PR</h4>'
+'<p>The Pixel Remaster deliberately omits the GBA-era additions, including the <b>Soul Shrine</b>. That matters because several guides — including bover_87\'s own PR bestiary checklist, which marks some entries as Veldt-<i>or</i>-Soul-Shrine — inherited that assumption from older versions.</p>'
+'<p><b>Treat every Soul Shrine fallback as nonexistent.</b> Magna Roader (red) and Rafflesia are the two most often waved off as recoverable. In PR they are not.</p>'
+'<h4 class="flag">Still unverified</h4>'
+'<ul>'
+'<li><b>Bit trigger.</b> bover_87 says kill all adds; RPG Site says PR specifically requires the Laser Gun and only the Laser Gun. Quicksave and test.</li>'
+'<li><b>Reload behaviour.</b> The +13 group jump is SNES/PS. Later versions randomise instead. Confirm which applies before leaning on Veldt manipulation.</li>'
+'</ul>'
+'</div></details>'

+'<details><summary>Esper maths — what HP/MP maxing costs</summary><div class="doc">'
+'<h4>Best esper per stat</h4>'
+'<ul><li>HP +50% — Bahamut</li><li>MP +50% — Crusader</li>'
+'<li>Strength +2 — Bismarck, Raiden</li><li>Magic +2 — Zona Seeker, Valigarmanda</li>'
+'<li>Stamina +2 — Golem, Lakshmi</li><li>Speed +2 — Odin</li></ul>'
+'<h4>The cost</h4>'
+'<p>Three Bahamut levels for HP, plus three to five Crusader levels for MP depending on character. Total <code>6–8 levels</code>, or <code>12–16</code> forgone points of Strength or Magic.</p>'
+'<h4>Does it matter?</h4>'
+'<p><b>Single-stat build: no.</b> You have roughly 90–94 level-ups. Capping one stat from a typical base costs <code>(128 − base) ÷ 2 ≈ 42–53</code>, leaving 37–52 spare. Six to eight of those is nothing. Take the HP and MP.</p>'
+'<p><b>Dual-stat build: decisive.</b> Two caps need about <code>94</code> levels against a <code>90–94</code> budget — already marginal before spending anything. Adding 6–8 puts it clearly out of reach.</p>'
+'<p>Gau is the only character the guide marks as needing both, which is why he is the only one skipping HP/MP here.</p>'
+'<h4>Climb order</h4>'
+'<ul><li>6 → ~47 — primary stat esper, watch the 128 cap</li>'
+'<li>48 → 50 — Crusader, plus extra levels for anyone needing 4 or 5</li>'
+'<li>51 → 68 — back to primary, or start a second stat if capped</li>'
+'<li>69 → 71 — Bahamut</li>'
+'<li>72 → 99 — secondary stat, then Speed/Stamina dumping</li></ul>'
+'<h4 class="flag">Still unverified</h4>'
+'<ul>'
+'<li><b>Per-character base stats.</b> Confirmed only for Relm (Vig 26 / Spd 34 / Sta 22 / Mag 44) and Mog (29 / 36 / 26 / 35), from a PlayStation-era guide. The level maths above is therefore approximate to about ±3 levels — not precise enough to settle a marginal dual-cap.</li>'
+'<li><b>Per-character HP growth curves.</b> Each character has their own, so the best three-level Bahamut window may not be 69–71 for everyone. That changes how much HP those levels yield, not whether to spend them. Community consensus also holds the Fandom wiki\'s MP figures are wrong — cross-check.</li>'
+'</ul>'
+'</div></details>'

+'<details><summary>Sources</summary><div class="doc"><ul>'
+'<li>Simmeh — <i>Low Level/Perfect Stats Walkthrough</i>, Steam guide 3614190585</li>'
+'<li>bover_87 — <i>FFVI PR Guide and Walkthrough</i> v1.1, GameFAQs (Missable Item Walkthrough, Bestiary Checklist, Stat Boosting)</li>'
+'<li>RPG Site — FF6 PR walkthrough, missable bestiary entries</li>'
+'<li>PSNProfiles — PR walkthrough: 346 entries, 214 chests, 50 hidden items, 27 magicite</li>'
+'</ul></div></details>';
}

function bestiaryHTML(){
  var tot=0,got=0;
  BEST.forEach(function(g){g.e.forEach(function(x){tot++;if(S.checked["b:"+x[0]])got++;});});
  var pct=tot?Math.round(got/tot*100):0;
  var h='<div class="card"><h3>Bestiary — by earliest location</h3>'
   +'<div class="bar"><i style="width:'+pct+'%"></i></div>'
   +'<div class="count" style="margin-bottom:9px">'+got+' / '+tot+' entries · '+pct+'%</div>'
   +'<p class="p">Ordered by route, not by bestiary number, so each block is a place you can clear in one visit. Blocks marked <b style="color:var(--warn)">CLOSES</b> become unreachable once you move on.</p>'
   +'<p class="p">A monster must be <b>defeated</b> to register. Fleeing counts for the Veldt but not the entry.</p></div>';
  var lastP="";
  BEST.forEach(function(g,gi){
    if(g.p!==lastP){h+='<div class="phase-name" style="margin:20px 0 10px">'+esc(g.p)+'</div>';lastP=g.p;}
    var d=0;g.e.forEach(function(x){if(S.checked["b:"+x[0]])d++;});
    var full=d===g.e.length,isOpen=!!open["b"+gi];
    h+='<div class="gate'+(full?" sealed":"")+'">';
    h+='<button class="gate-head" data-gate="b'+gi+'" aria-expanded="'+isOpen+'">';
    h+='<span class="chev">'+(isOpen?"▼":"▶")+'</span><span class="gate-title">'+esc(g.loc)
     +(g.m?' <span style="color:var(--warn);font-size:9px;letter-spacing:.1em">CLOSES</span>':"")+'</span>';
    h+=full?'<span class="stamp">DONE</span>':'<span class="tally">'+d+"/"+g.e.length+'</span>';
    h+='</button>';
    if(isOpen){
      h+='<div class="gbody">';
      g.e.forEach(function(x){
        var k="b:"+x[0],on=!!S.checked[k];
        h+='<button class="item'+(on?" on":"")+'" data-key="'+k+'" aria-pressed="'+on+'">'
         +'<span class="box">'+(on?"✓":"")+'</span>'
         +'<span style="color:var(--ink-dim);width:34px;flex:none">#'+x[0]+'</span>'
         +'<span>'+esc(x[1])+'</span></button>';
      });
      h+='</div>';
    }
    h+='</div>';
  });
  h+='<div class="card" style="margin-top:16px"><h3 class="flag" style="color:var(--warn)">Scope and caveats</h3>'
   +'<p class="p">This covers all <b>262 regular entries</b> plus the early bosses. PR numbers bosses on a separate track, and the remaining boss entries are straightforward — you cannot miss a boss you had to fight to progress. Use the in-game counter for those.</p>'
   +'<p class="p">Locations follow bover_87\'s PR guide, not the general Final Fantasy wiki, because PR moved some spawns. Where the two disagree — Leaf Bunny and Darkwind, for example — this list follows the PR source.</p>'
   +'<p class="p">Your best cross-check is still in-game: the main-menu bestiary Display Map marks unregistered entries with a <b>?</b>.</p></div>';
  return h;
}

function render(){
  renderHead();
  document.getElementById("view").innerHTML =
    tab==="gates"?gatesHTML():tab==="beasts"?bestiaryHTML():tab==="levels"?levelsHTML():
    tab==="rages"?ragesHTML():notesHTML();
}

/* ---------- events ---------- */
document.querySelector("nav").addEventListener("click",function(e){
  var b=e.target.closest("button[data-tab]");if(!b)return;
  tab=b.dataset.tab;
  document.querySelectorAll("nav button").forEach(function(x){x.setAttribute("aria-selected",x===b);});
  render();window.scrollTo(0,0);
});

document.getElementById("view").addEventListener("click",function(e){
  var g=e.target.closest("[data-gate]");
  if(g){open[g.dataset.gate]=!open[g.dataset.gate];render();return;}
  var k=e.target.closest("[data-key]");
  if(k){S.checked[k.dataset.key]=!S.checked[k.dataset.key];save();render();return;}
  var r=e.target.closest("[data-role]");
  if(r){S[r.dataset.role]=r.dataset.val;save();render();}
});

document.getElementById("export").addEventListener("click",function(){
  var io=document.getElementById("io");
  io.style.display="block";io.value=JSON.stringify(S);io.select();
  note("Copy this text somewhere safe — Notes, email, anywhere.");
});
document.getElementById("import").addEventListener("click",function(){
  var io=document.getElementById("io");
  if(io.style.display!=="block"){io.style.display="block";io.value="";io.focus();note("Paste a progress code, then tap Restore again.");return;}
  try{
    var p=JSON.parse(io.value);
    S.checked=p.checked||{};S.terra=p.terra||"Magic";S.celes=p.celes||"Strength";
    save();render();io.style.display="none";note("Progress restored.");
  }catch(err){note("That code could not be read. Check it copied fully.");}
});
document.getElementById("reset").addEventListener("click",function(){
  if(!confirm("Clear all tracked progress?"))return;
  S.checked={};save();render();note("Cleared.");
});

render();
</script>
