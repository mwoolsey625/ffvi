<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FFVI Run">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="theme-color" content="#0A0F26">
<title>FFVI PR — Perfect Stats + Full Bestiary</title>
<style>:root{
  /* Magicite window — FFVI's menu blue, deepened and made consistent */
  --field:#0A0F26;
  --panel:#141B3C;
  --panel2:#1E2854;
  --rule:rgba(160,180,235,.28);
  --rule-dim:#2A3663;
  --hair:rgba(255,255,255,.075);
  --ink:#EDF1FF;
  --ink-dim:#8FA0CE;
  --magicite:#A98CF0;
  --sealed:#4FD3A6;
  --warn:#F5B65E;
  --cyan:#6FC5E8;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;
  --r-lg:16px; --r-md:12px; --r-sm:9px;
  --sh:0 1px 2px rgba(0,0,0,.45),0 8px 22px -12px rgba(0,0,0,.75);
  --sh-lift:0 2px 4px rgba(0,0,0,.4),0 16px 34px -16px rgba(0,0,0,.85);
  --gloss:inset 0 1px 0 rgba(255,255,255,.075);
  --ease:cubic-bezier(.32,.72,.35,1);
  --t:.18s var(--ease);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--field)}
body{
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;line-height:1.55;
  padding:calc(16px + env(safe-area-inset-top)) 14px calc(60px + env(safe-area-inset-bottom));
  max-width:780px;margin:0 auto;-webkit-text-size-adjust:100%;
  background:radial-gradient(900px 460px at 50% -140px,rgba(169,140,240,.13),transparent 70%),var(--field);
  background-attachment:fixed;
}

/* ---------- header ---------- */
header{border-bottom:1px solid var(--hair);padding-bottom:16px;margin-bottom:18px}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--magicite);margin-bottom:8px}
.titlerow{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.titlerow h1{flex:1;margin:0}
h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0 0 10px}
#hdrbk{
  flex:none;padding:10px 14px;min-height:40px;
  background:linear-gradient(180deg,var(--panel2),#18204A);
  border:1px solid var(--hair);color:var(--ink);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  border-radius:var(--r-md);cursor:pointer;
  box-shadow:var(--sh),var(--gloss);transition:transform .12s var(--ease),box-shadow var(--t),background var(--t);
}
#hdrbk:active{transform:translateY(1px);box-shadow:none;background:var(--panel2)}
.bar{height:8px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.45)}
.bar>i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--magicite),var(--cyan) 60%,var(--sealed));box-shadow:0 0 12px -2px rgba(169,140,240,.7);transition:width .45s var(--ease)}
.count{font-family:var(--mono);font-size:11px;color:var(--ink-dim);margin-top:8px;letter-spacing:.05em}

/* ---------- tabs ---------- */
nav{
  display:flex;flex-wrap:wrap;gap:5px;margin-bottom:20px;
  padding:5px;border-radius:var(--r-lg);
  background:rgba(255,255,255,.035);border:1px solid var(--hair);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.3);
}
nav button{
  flex:1 1 28%;min-height:42px;padding:10px 4px;
  background:transparent;color:var(--ink-dim);
  border:1px solid transparent;border-radius:var(--r-md);
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  cursor:pointer;transition:background var(--t),color var(--t),box-shadow var(--t);
}
nav button[aria-selected="true"]{
  background:linear-gradient(180deg,var(--panel2),#19214A);
  color:var(--ink);border-color:var(--hair);
  box-shadow:var(--sh),var(--gloss);
}
button:focus-visible,summary:focus-visible{outline:2px solid var(--magicite);outline-offset:2px;border-radius:var(--r-sm)}

/* ---------- phases + gates ---------- */
.phase{margin-bottom:30px}
.phase-name{font-size:14px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px}
.phase-note{font-size:11.5px;color:var(--ink-dim);margin-bottom:14px}
.gate{
  border:1px solid var(--hair);border-radius:var(--r-lg);margin-bottom:10px;overflow:hidden;
  background:linear-gradient(180deg,var(--panel),#111735);
  box-shadow:var(--sh),var(--gloss);
  transition:border-color var(--t),box-shadow var(--t);
}
.gate.sealed{
  border-color:rgba(79,211,166,.34);
  background:linear-gradient(180deg,rgba(79,211,166,.05),rgba(10,15,38,.6));
  box-shadow:none;
}
.gate-head{
  width:100%;display:flex;align-items:center;gap:10px;
  padding:15px 15px;min-height:58px;
  background:transparent;border:0;color:inherit;
  font-family:var(--sans);font-size:14px;text-align:left;cursor:pointer;
  transition:background var(--t);
}
.gate-head:active{background:rgba(255,255,255,.04)}
.chev{color:var(--ink-dim);font-size:10px;width:10px;flex:none;transition:color var(--t)}
.gate-title{flex:1;font-weight:600;letter-spacing:-.005em}
.gate.sealed .gate-title{color:var(--ink-dim);text-decoration:line-through;text-decoration-color:var(--rule-dim)}
.stamp{
  font-family:var(--mono);font-size:9px;letter-spacing:.16em;
  padding:4px 9px;border-radius:99px;
  border:1px solid rgba(79,211,166,.5);background:rgba(79,211,166,.12);
  color:var(--sealed);flex:none;
}
.tally{font-family:var(--mono);font-size:10.5px;color:var(--ink-dim);flex:none;letter-spacing:.06em;
  padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.05)}
.gbody{padding:0 15px 16px;border-top:1px solid var(--hair)}

/* ---------- section headers inside a gate ---------- */
.sect{
  width:100%;text-align:left;cursor:pointer;font-family:var(--mono);
  display:flex;align-items:center;gap:10px;
  margin:24px -15px 10px;padding:13px 15px;
  background:linear-gradient(180deg,var(--panel2),rgba(30,40,84,.45));
  border:0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
  border-left:3px solid var(--magicite);
  font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;
  color:var(--ink);transition:background var(--t);
}
.sect:active{background:var(--panel2)}
.sect-chev{font-size:9px;opacity:.75;width:9px;flex:none}
.sect-n{margin-left:auto;color:var(--ink-dim);font-size:11.5px;letter-spacing:.05em;font-weight:600}
.sect-n.ok{color:var(--sealed)!important}
.sect-tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;padding:4px 9px;border-radius:99px;border:1px solid currentColor;font-weight:600;white-space:nowrap;opacity:.95}
.sect-note{font-size:12px;color:var(--ink-dim);margin:0 0 8px;line-height:1.5}
.seal-line{font-family:var(--mono);font-size:10px;color:var(--ink-dim);letter-spacing:.05em;padding:10px 0 2px}
.seal-line b{color:var(--warn);font-weight:600}
.warn{
  font-size:11.5px;color:var(--warn);
  background:rgba(245,182,94,.07);
  border-left:3px solid var(--warn);border-radius:0 var(--r-md) var(--r-md) 0;
  padding:9px 12px;margin:10px 0 6px;line-height:1.45;
}

/* ---------- checklist rows ---------- */
.item{
  width:100%;display:flex;align-items:flex-start;gap:11px;
  padding:12px 8px;min-height:48px;border-radius:var(--r-md);
  background:transparent;border:0;border-top:1px solid var(--hair);
  color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;
  text-align:left;cursor:pointer;transition:background var(--t);
}
.item:active{background:rgba(255,255,255,.05)}
.box{
  width:19px;height:19px;flex:none;margin-top:1px;
  border:1.5px solid var(--rule);border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--field);
  transition:background var(--t),border-color var(--t),box-shadow var(--t);
}
.item.on .box{background:var(--sealed);border-color:var(--sealed);box-shadow:0 0 10px -2px rgba(79,211,166,.6)}
.item.on span:last-child{color:var(--ink-dim);text-decoration:line-through;text-decoration-color:var(--rule-dim)}
.item.auto{cursor:default}
.item.auto:active{background:transparent}
.item.auto .box{border-radius:50%}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--magicite);font-weight:600;padding:0 8px 9px 0;border-bottom:1px solid var(--rule)}
td{padding:11px 8px 11px 0;border-bottom:1px solid var(--hair);vertical-align:top}
.nm{font-weight:600;white-space:nowrap}
.sub{display:block;font-size:12px;color:var(--ink-dim);margin-top:3px;line-height:1.45;white-space:normal}
.dual{color:var(--magicite);font-weight:700}
.skip{color:var(--ink-dim)}

/* ---------- cards ---------- */
.card{
  border:1px solid var(--hair);border-radius:var(--r-lg);padding:16px;margin-bottom:16px;
  background:linear-gradient(180deg,var(--panel),#111735);
  box-shadow:var(--sh),var(--gloss);
}
.card h3{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--magicite);margin:0 0 11px;font-weight:600}
.p{font-size:12.5px;color:var(--ink-dim);line-height:1.65;margin:0 0 10px}
.p:last-child{margin-bottom:0}
.p b{color:var(--ink);font-weight:600}

/* ---------- small controls ---------- */
.seg{
  padding:10px 15px;min-height:40px;border-radius:var(--r-md);
  background:rgba(255,255,255,.04);border:1px solid var(--hair);
  color:var(--ink-dim);font-family:var(--mono);font-size:11px;cursor:pointer;
  transition:background var(--t),color var(--t),border-color var(--t),box-shadow var(--t),transform .12s var(--ease);
}
.seg:active{transform:translateY(1px)}
.seg.on{background:linear-gradient(180deg,var(--panel2),#19214A);color:var(--ink);border-color:rgba(169,140,240,.55);box-shadow:var(--sh),var(--gloss)}
.row{display:flex;align-items:center;gap:8px;margin-top:10px}
.row>span{width:52px;font-size:12px;font-weight:600}

/* ---------- disclosure ---------- */
details{
  border:1px solid var(--hair);border-radius:var(--r-lg);margin-bottom:10px;overflow:hidden;
  background:linear-gradient(180deg,var(--panel),#111735);box-shadow:var(--sh),var(--gloss);
}
summary{padding:15px;cursor:pointer;font-size:14px;font-weight:600;list-style:none;transition:background var(--t)}
summary:active{background:rgba(255,255,255,.04)}
summary::-webkit-details-marker{display:none}
summary::before{content:"▶ ";color:var(--ink-dim);font-size:10px}
details[open] summary::before{content:"▼ "}
details[open] summary{border-bottom:1px solid var(--hair)}
.doc{padding:15px;font-size:14px;line-height:1.7;color:var(--ink-dim)}
.doc h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--magicite);margin:20px 0 8px;font-weight:600}
.doc h4:first-child{margin-top:0}
.doc p{margin:0 0 11px}
.doc b{color:var(--ink)}
.doc ul{margin:0 0 11px;padding-left:19px}
.doc li{margin-bottom:6px}
.doc code{font-family:var(--mono);background:var(--panel2);padding:2px 6px;border-radius:6px;font-size:12px;color:var(--ink)}
.doc .flag{color:var(--warn)}

/* ---------- footer tools ---------- */
.tools{margin-top:28px;display:flex;flex-wrap:wrap;gap:8px}
.tools button{
  padding:12px 16px;min-height:44px;border-radius:var(--r-md);
  background:rgba(255,255,255,.04);border:1px solid var(--hair);color:var(--ink-dim);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
  transition:background var(--t),color var(--t),transform .12s var(--ease);
}
.tools button:active{transform:translateY(1px);background:var(--panel2);color:var(--ink)}
#io{
  width:100%;margin-top:12px;background:rgba(0,0,0,.28);color:var(--ink);
  border:1px solid var(--hair);border-radius:var(--r-md);padding:12px;
  font-family:var(--mono);font-size:11px;min-height:76px;display:none;
}
.msg{font-family:var(--mono);font-size:11px;color:var(--sealed);margin-top:10px;min-height:15px}

@media (hover:hover){
  .gate-head:hover{background:rgba(255,255,255,.03)}
  .item:hover{background:rgba(255,255,255,.04)}
  .item.auto:hover{background:transparent}
  nav button:hover{color:var(--ink)}
  .tools button:hover{color:var(--ink);border-color:var(--rule)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="eyebrow">FFVI Pixel Remaster · Perfect Stats + Full Bestiary</div>
  <div class="titlerow"><h1>Run Tracker</h1><button id="hdrbk" title="Copy a progress backup code">⤓ Backup</button></div>
  <div class="bar"><i id="fill"></i></div>
  <div class="count" id="count">—</div>
</header>

<nav role="tablist">
  <button role="tab" data-tab="route" aria-selected="true">Route</button>
  <button role="tab" data-tab="levels" aria-selected="false">Levels</button>
  <button role="tab" data-tab="gear" aria-selected="false">Gear</button>
  <button role="tab" data-tab="coli" aria-selected="false">Coliseum</button>
  <button role="tab" data-tab="rages" aria-selected="false">Rages</button>
  <button role="tab" data-tab="notes" aria-selected="false">Notes</button>
</nav>

<main id="view"></main>

<div id="build" style="margin-top:14px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--rule-dim)">build e91c2fa</div>

<!-- Data arrays — must load before the main script below -->
<script src="data/route.js?b=e91c2fa"></script>
<script src="data/rages.js?b=e91c2fa"></script>
<script src="data/treasure.js?b=e91c2fa"></script>
<script src="data/gear.js?b=e91c2fa"></script>
<script src="data/bestiary.js?b=e91c2fa"></script>
<script src="data/roster.js?b=e91c2fa"></script>

<script>
"use strict";
var KEY = "ff6pr-tracker-v1";
var GIST_KEY = "ff6pr-gist-id";
var TOKEN_KEY = "ff6pr-gist-token";
/* Permanent fallback so a fully wiped device (Safari "Clear website data",
   or removing + re-adding the Home Screen icon) can still recover progress:
   this ID is baked into the source, so it survives even when localStorage
   \u2014 including the copy of the ID normally cached there \u2014 is gone. */
var GIST_ID_BUILTIN = "596d1edfb7763ac049884fc4b5058b2d";
var S={checked:{},terra:"Magic",celes:"Strength",assign:{},updated:0},tab="route",open={};
var CANSTORE=(function(){try{localStorage.setItem("__t","1");localStorage.removeItem("__t");return true;}catch(e){return false;}})();
var LOADFAIL=false;
if(CANSTORE){var raw=localStorage.getItem(KEY);
if(raw){try{var p=JSON.parse(raw);S.checked=p.checked||{};S.terra=p.terra||"Magic";S.celes=p.celes||"Strength";S.assign=p.assign||{};S.updated=p.updated||0;if(p.open)open=p.open;}
catch(e){LOADFAIL=true;try{localStorage.setItem(KEY+"-damaged",raw);}catch(e2){}}}}
function note(t){
var c=document.getElementById("count");if(!c)return;
c.textContent=t;
if(note._t)clearTimeout(note._t);
note._t=setTimeout(function(){renderHead();},4000);
}
function save(){if(!CANSTORE||LOADFAIL)return;
S.updated=Date.now();
try{var prev=localStorage.getItem(KEY);if(prev)localStorage.setItem(KEY+"-prev",prev);
localStorage.setItem(KEY,JSON.stringify({checked:S.checked,terra:S.terra,celes:S.celes,assign:S.assign,open:open,updated:S.updated}));}
catch(e){note("Storage unavailable \u2014 use Back up progress.");}
scheduleCloudPush();}

/* ---------- Cloud backup (private GitHub Gist) ----------
   Local storage alone cannot survive a full Safari data wipe or a
   Home Screen icon removal \u2014 both clear every key at once, including
   any "previous version" copies kept in the same storage. A copy that
   lives outside the browser (a Gist) is the only thing that survives that. */
var CLOUD={status:"idle",lastSync:0,err:""};
var pushTimer=null;
function getToken(){try{return (CANSTORE&&localStorage.getItem(TOKEN_KEY))||"";}catch(e){return "";}}
function setToken(t){try{if(!CANSTORE)return;if(t)localStorage.setItem(TOKEN_KEY,t);else localStorage.removeItem(TOKEN_KEY);}catch(e){}}
function gistId(){if(GIST_ID_BUILTIN)return GIST_ID_BUILTIN;try{return (CANSTORE&&localStorage.getItem(GIST_KEY))||"";}catch(e){return "";}}
function statePayload(){return JSON.stringify({checked:S.checked,terra:S.terra,celes:S.celes,assign:S.assign,updated:S.updated});}
function renderCloudStatus(){if(tab==="notes")render();}
function scheduleCloudPush(){
if(!getToken())return;
if(pushTimer)clearTimeout(pushTimer);
pushTimer=setTimeout(function(){pushTimer=null;cloudPush();},3000);
}
function cloudPush(){
var tok=getToken(),gid=gistId();
if(!tok)return;
CLOUD.status="syncing";renderCloudStatus();
var url,method,body;
if(gid){
url="https://api.github.com/gists/"+gid;method="PATCH";
body=JSON.stringify({files:{"ff6-tracker-progress.json":{content:statePayload()}}});
}else{
url="https://api.github.com/gists";method="POST";
body=JSON.stringify({description:"FFVI PR Run Tracker \u2014 progress backup",public:false,
files:{"ff6-tracker-progress.json":{content:statePayload()}}});
}
fetch(url,{method:method,keepalive:true,headers:{"Authorization":"token "+tok,
"Accept":"application/vnd.github+json","Content-Type":"application/json"},body:body})
.then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
.then(function(j){
if(!gid&&j.id){try{if(CANSTORE)localStorage.setItem(GIST_KEY,j.id);}catch(e){}}
CLOUD.status="synced";CLOUD.lastSync=Date.now();CLOUD.err="";renderCloudStatus();
})
.catch(function(e){CLOUD.status="error";CLOUD.err=String((e&&e.message)||e);renderCloudStatus();});
}
function cloudPull(cb){
var gid=gistId();
if(!gid){cb(null,null);return;}
var tok=getToken(),headers={"Accept":"application/vnd.github+json"};
if(tok)headers.Authorization="token "+tok;
fetch("https://api.github.com/gists/"+gid,{headers:headers})
.then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
.then(function(j){
var f=j.files&&j.files["ff6-tracker-progress.json"];
if(!f||!f.content){cb(null,"empty");return;}
var remote;try{remote=JSON.parse(f.content);}catch(e){cb(null,"corrupt");return;}
cb(remote,null);
})
.catch(function(e){cb(null,String((e&&e.message)||e));});
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function allKeys(){var a={};ROUTE.forEach(function(r){stopKeys(r).forEach(function(k){a[k]=1;});});return Object.keys(a);}
function itemKey(g,it,i){var p=String(it).split("|");return p[1]?"b:"+p[1]:g.id+":"+i;}
function itemLabel(it){return String(it).split("|")[0];}
function itemNum(it){var p=String(it).split("|");return p[1]||"";}
function progress(){var k=allKeys(),d=0;k.forEach(function(x){if(S.checked[x])d++;});return{d:d,t:k.length};}
function renderHead(){
var p=progress(),pct=p.t?Math.round(p.d/p.t*100):0;
document.getElementById("fill").style.width=pct+"%";
document.getElementById("count").textContent=p.d+" / "+p.t+" tracked · "+pct+"%";
}
var PHNAME={1:"Phase I \u2014 Levels Held (EXP 0x)",2:"Phase II \u2014 The Split",
3:"Phase III \u2014 Unlocked",4:"World of Ruin"};
var PHNOTE={1:"Average level 5\u20136. Much of this becomes unreachable once you move on.",
2:"Stat espers are live. Levels stop being free.",
3:"Real stats. The Floating Continent sweep is easy now.",
4:"Cyan's Dream is the largest single loss still available."};
var MISSABLE={};
/* Bestiary numbers whose Rage you want before the Veldt fills up. */
var RAGEWANT={278:1,18:1,40:1,44:1,51:1,50:1,64:1,32:1,97:1};
(function(){
PHASES.forEach(function(p){p.gates.forEach(function(g){
g.items.forEach(function(it){var n=itemNum(it); if(n) MISSABLE[n]=1;});
});});
})();
/* Mandatory story bosses need no manual tick — you fight them whether you like it
   or not. The exceptions are anything still flagged missable/rare (Hell's Rider)
   or wanted early for its Rage (Guard Leader) — those stay real checkboxes. */
function isMandatoryBoss(x){return x[0]>=276 && !MISSABLE[x[0]] && !RAGEWANT[x[0]];}
/* Does a LATER route stop (or the Act 1 Cleanup section) track this same bestiary
   number again? If so an earlier "closes soon" stop doesn't need to panic about it. */
function laterEnemyOccurrence(num,afterRi){
for(var i=afterRi+1;i<ROUTE.length;i++){
var rr=ROUTE[i];
for(var j=0;j<rr[5].length;j++){
var bl=BEST[rr[5][j]]; if(!bl) continue;
for(var k=0;k<bl.e.length;k++){ if(bl.e[k][0]===num) return true; }
}
}
return false;
}
/* Missable status and blanket "closes now" flags (wob/once/timed) only force

+'<details open><summary>Route merge — how this run differs</summary><div class="doc">'
+'<h4>What this reconciles</h4>'
+'<p>Two guides that were never written to work together. <b>Simmeh\'s Low Level/Perfect Stats Walkthrough</b> (Steam) gives boss strategy and level discipline but explicitly disclaims bestiary coverage. <b>bover_87\'s Missable Item Walkthrough</b> (GameFAQs) gives the cutoffs but knows nothing about level-locking. Where one says skip and the other says kill, the Gates tab already resolves it.</p>'
+'<h4>The core reframe</h4>'
+'<p>Simmeh keeps encounters <b>off</b> all game to limit Veldt entropy so Gau\'s Rages stay findable. A full bestiary wants the opposite. Accept the congested Veldt — it is the price of the run. Mitigate by front-loading the eight Rages on the Rages tab.</p>'
+'<p>With EXP at 0x, extra combat is <b>free</b>. Nothing about fighting more threatens the stat plan during Phase I. The threat is dying at level 5.</p>'
+'<h4>Phase I survival pattern</h4>'
+'<p>Gobbledygook Rage to Vanish the party, or the Phantom esper once you have it. An Invisible party is immune to physicals, which trivialises most low-level grinding. Simmeh uses this only for Number 024 and the Esper Cave — use it far more broadly.</p>'
+'<h4>The three traps that matter most</h4>'
+'<ul>'
+'<li><b>Cave to the Sealed Gate.</b> Simmeh says to waltz through with encounters off because there are no Rages worth having. That cave hard-locks five entries plus the Ultima Weapon, Heiji\'s Jitte and Kazekiri #2 when you board at Albrook.</li>'
+'<li><b>Air Force.</b> His PSG strategy is two Thundaras on the main body, which ends the fight before Bit ever spawns. Bit never appears again.</li>'
+'<li><b>Naude.</b> Must be killed, not merely forced to flee. Imp is the standard clear and it makes them run, registering nothing. Six-minute timer, and Celes is force-joined — so level her before ascending past Ultima Weapon.</li>'
+'</ul>'
+'<h4>Best synergy</h4>'
+'<p>The Floating Continent. Simmeh\'s low-level advice is to flee Ninjas and Dragons on sight, but in a PSG you arrive with a level-26 Gau. The eight required entries fold into the same trip where you are already farming to level Shadow and your Break-caster.</p>'
+'<h4>Verification tool</h4>'
+'<p>The <b>main-menu</b> bestiary — not the in-game one — has a Display Map that puts a <b>?</b> marker on any location with unregistered entries. Run it before every gate, especially the end-of-Act-I audit.</p>'
+'<p>Registration rule: a monster generally must be <b>defeated</b> to enter the bestiary. Fleeing is enough for Veldt appearance but not for the entry.</p>'
+'<h4 class="flag">No safety net in PR</h4>'
+'<p>The Pixel Remaster deliberately omits the GBA-era additions, including the <b>Soul Shrine</b>. That matters because several guides — including bover_87\'s own PR bestiary checklist, which marks some entries as Veldt-<i>or</i>-Soul-Shrine — inherited that assumption from older versions.</p>'
+'<p><b>Treat every Soul Shrine fallback as nonexistent.</b> Magna Roader (red) and Rafflesia are the two most often waved off as recoverable. In PR they are not.</p>'
+'<h4 class="flag">Still unverified</h4>'
+'<ul>'
+'<li><b>Bit trigger.</b> bover_87 says kill all adds; RPG Site says PR specifically requires the Laser Gun and only the Laser Gun. Quicksave and test.</li>'
+'<li><b>Reload behaviour.</b> The +13 group jump is SNES/PS. Later versions randomise instead. Confirm which applies before leaning on Veldt manipulation.</li>'
+'</ul>'
+'</div></details>'
+'<details><summary>Esper maths — what HP/MP maxing costs</summary><div class="doc">'
+'<h4>Best esper per stat</h4>'
+'<ul><li>HP +50% — Bahamut</li><li>MP +50% — Crusader</li>'
+'<li>Strength +2 — Bismarck, Raiden</li><li>Magic +2 — Zona Seeker, Valigarmanda</li>'
+'<li>Stamina +2 — Golem, Lakshmi</li><li>Speed +2 — Odin</li></ul>'
+'<h4>The cost</h4>'
+'<p>Three Bahamut levels for HP, plus three to five Crusader levels for MP depending on character. Total <code>6–8 levels</code>, or <code>12–16</code> forgone points of Strength or Magic.</p>'
+'<h4>Does it matter?</h4>'
+'<p><b>Single-stat build: no.</b> You have roughly 90–94 level-ups. Capping one stat from a typical base costs <code>(128 − base) ÷ 2 ≈ 42–53</code>, leaving 37–52 spare. Six to eight of those is nothing. Take the HP and MP.</p>'

+'<p>Gau is the only character the guide marks as needing both, which is why he is the only one skipping HP/MP here.</p>'
+'<h4>Climb order</h4>'
+'<ul><li>6 → ~47 — primary stat esper, watch the 128 cap</li>'

+'<li>51 → 68 — back to primary, or start a second stat if capped</li>'
+'<li>69 → 71 — Bahamut</li>'

+'</div></details>'

+'<h4 class="flag">Provenance</h4>'

+'<p class="p">A monster must be <b>defeated</b> to register. Fleeing counts for the Veldt but not the entry.</p></div>';
var lastP="";
BEST.forEach(function(g,gi){
if(g.p!==lastP){h+='<div class="phase-name" style="margin:20px 0 10px">'+esc(g.p)+'</div>';
if(g.p==="World of Balance — Act 1 Cleanup") h+='<div class="phase-note">Non-missable World of Balance zones, pulled out of the main sequence so they don\'t compete for attention with anything urgent. Nothing here closes before the Floating Continent — sweep it in one pass instead of picking pieces up on the Veldt, which only dilutes the pool for rarer Rages you still need there.</div>';
lastP=g.p;}
var d=0;g.e.forEach(function(x){if(S.checked["b:"+x[0]])d++;});
var full=d===g.e.length,isOpen=!!open["b"+gi];
h+='<div class="gate'+(full?" sealed":"")+'">';
h+='<button class="gate-head" data-gate="b'+gi+'" aria-expanded="'+isOpen+'">';
h+='<span class="chev">'+(isOpen?"▼":"▶")+'</span><span class="gate-title">'+esc(g.loc)
+(g.m?' <span style="color:var(--warn);font-size:9px;letter-spacing:.1em">CLOSES</span>':"")+'</span>';
h+=full?'<span class="stamp">CLEARED</span>':'<span class="tally">'+d+"/"+g.e.length+'</span>';
h+='</button>';
if(isOpen){
h+='<div class="gbody">';
g.e.forEach(function(x){
var k="b:"+x[0],on=!!S.checked[k];
h+='<button class="item'+(on?" on":"")+'" data-key="'+k+'" aria-pressed="'+on+'">'
+'<span class="box">'+(on?"✓":"")+'</span>'
+'<span style="color:var(--ink-dim);width:34px;flex:none">#'+x[0]+'</span>'
+'<span>'+esc(x[1])
+(x[2]?'<span class="sub">'+esc(x[2])+'</span>':"")
+'</span></button>';
});
h+='</div>';
}
h+='</div>';
});
h+='<div class="card" style="margin-top:16px"><h3 class="flag" style="color:var(--warn)">Scope and caveats</h3>'
+'<p class="p">This covers all <b>262 regular entries</b> plus the early bosses. PR numbers bosses on a separate track, and the remaining boss entries are straightforward — you cannot miss a boss you had to fight to progress. Use the in-game counter for those.</p>'
+'<p class="p">Locations follow bover_87\'s PR guide, not the general Final Fantasy wiki, because PR moved some spawns. Where the two disagree — Leaf Bunny and Darkwind, for example — this list follows the PR source.</p>'
+'<p class="p">Your best cross-check is still in-game: the main-menu bestiary Display Map marks unregistered entries with a <b>?</b>.</p>'
+'<p class="p"><b>Act 1 Cleanup exclusions, on purpose:</b> the Narshe classroom/mines trio (Guard, Silver Lobo, Megalodoth, Wererat, Spritzer, Bandit) stayed under the prologue — Narshe locks you out immediately after, and whether the same mine encounters are live again during the later Lone Wolf chase is not confirmed, so treating them as deferrable risked losing them. Locke\'s South Figaro trio (Heavy Armor, Commander, Vector Hound) stayed put for the opposite reason: it\'s confirmed available even into the World of Ruin basements, so it never needed Act 1 urgency framing at all.</p></div>';
return h;
}
function tkey(area,x,i){ return x[5] ? "tg:"+x[5] : "t:"+area+":"+i; }
function chestsHTML(){
var gmap={};
TREASURE.forEach(function(g){g.e.forEach(function(x){
if(x[5]){ (gmap[x[5]]=gmap[x[5]]||[]).push(g.a); }
});});
var seen={}, tot=0, got=0, ch=0, chGot=0;
TREASURE.forEach(function(g){g.e.forEach(function(x,i){
var k=tkey(g.a,x,i); if(seen[k]) return; seen[k]=1;
tot++; var on=!!S.checked[k]; if(on)got++;
if(x[3]==="Chest"){ ch++; if(on)chGot++; }
});});
var pct=tot?Math.round(got/tot*100):0;
var LBL={F:["",""],W:["WAIT","var(--magicite)"],
N:["TAKE NOW","var(--warn)"],L:["LAST CHANCE","var(--sealed)"]};
var h='<div class="card"><h3>Treasure — full checklist</h3>'
+'<div class="bar"><i style="width:'+pct+'%"></i></div>'
+'<div class="count" style="margin-bottom:9px">'+got+' / '+tot+' containers · '
+chGot+' / '+ch+' chests</div>'
+'<p class="p"><b>Linked across sections.</b> A container listed at several story points is one physical container — tick it once and it shows as taken everywhere else it appears. Those rows carry a <b style="color:var(--rule)">\u21c4</b> marker.</p>'
+'<p class="p"><b>Waiting never costs the achievement.</b> The game registers the container, not its contents.</p>'
+'<p class="p"><b style="color:var(--magicite)">WAIT</b> upgrades later · '
+'<b style="color:var(--warn)">TAKE NOW</b> gets worse if you leave it · '
+'<b style="color:var(--sealed)">LAST CHANCE</b> is the final version. Unmarked never changes.</p></div>';
h+='<div class="card"><h3>Checkpoints</h3>'
+'<p class="p"><b>118 chests</b> before the Floating Continent. <b>122</b> by the end of the World of Balance. Short at either means something upstream was missed.</p>'
+'<p class="p">Per-zone counts on the in-game map are authoritative. Use this list for <i>which</i> and <i>when</i>, the map for <i>how many</i>.</p></div>';
TREASURE.forEach(function(g,gi){
var d=0;g.e.forEach(function(x,i){if(S.checked[tkey(g.a,x,i)])d++;});
var full=d===g.e.length,isOpen=!!open["t"+gi];
var hasUp=g.e.some(function(x){return x[0]!=="F";});
h+='<div class="gate'+(full?" sealed":"")+'">';
h+='<button class="gate-head" data-gate="t'+gi+'" aria-expanded="'+isOpen+'">';
h+='<span class="chev">'+(isOpen?"\u25bc":"\u25b6")+'</span><span class="gate-title">'+esc(g.a)
+(hasUp?' <span style="color:var(--magicite);font-size:9px;letter-spacing:.1em">UPGRADES</span>':"")+'</span>';
h+=full?'<span class="stamp">CLEARED</span>':'<span class="tally">'+d+"/"+g.e.length+'</span>';
h+='</button>';
if(isOpen){
h+='<div class="gbody">';
if(g.n) h+='<div class="warn">'+esc(g.n)+'</div>';
g.e.forEach(function(x,i){
var k=tkey(g.a,x,i),on=!!S.checked[k],lb=LBL[x[0]];
var others=x[5]?gmap[x[5]].filter(function(a){return a!==g.a;}):[];
h+='<button class="item'+(on?" on":"")+'" data-key="'+k+'" aria-pressed="'+on+'">'
+'<span class="box">'+(on?"\u2713":"")+'</span><span>'
+(x[5]?'<span style="color:var(--rule)">\u21c4 </span>':"")
+esc(x[1])
+(x[2]?' <span style="color:var(--magicite)">\u2192 '+esc(x[2])+'</span>':"")
+(lb[0]?' <span style="color:'+lb[1]+';font-size:9px;letter-spacing:.08em">'+lb[0]+'</span>':"")
+'<span class="sub">'+esc(x[3])+' \u00b7 '+esc(x[4])
+(others.length?'<br>\u21c4 same container as: '+esc(others.join(" / ")):"")
+'</span></span></button>';
});
h+='</div>';
}
h+='</div>';
});
h+='<div class="card" style="margin-top:16px"><h3 style="color:var(--warn)">One trade worth making</h3>'
+'<p class="p">The South Figaro Cave northwest-stairs chest gives a <b>Thunder Rod</b> on the Locke-and-Celes pass. Breaking it on <b>Tunnel Armor</b> is close to a one-shot — but the same chest becomes a <b>Hero\'s Ring</b> in the World of Ruin, and Celes and Sabin walk back through this cave chasing Gerad, so the return trip is guaranteed.</p>'
+'<p class="p"><b>Leave it.</b> Runic every turn beats the boss without the rod. The west-end chest is the opposite case: its <b>X-Potion</b> is already the final version, so take that one now.</p></div>';
h+='<div class="card"><h3 class="flag" style="color:var(--warn)">Provenance — read once</h3>'
+'<p class="p">Locations and upgrade markers come from Corundum\'s checklist, which is <b>SNES-era</b> and cross-listed onto the PR page. Container positions have been stable across versions, so the <i>where</i> is reliable. Item names are mapped to PR wording only where certain (Tonic\u2192Potion, Tincture\u2192Ether, Ether\u2192Hi-Ether, Fenix Down\u2192Phoenix Down, Atma\u2192Ultima Weapon).</p>'
+'<p class="p">After linking duplicates this gives <b>265 unique containers</b>; PR counts <b>214 chests + 50 hidden items = 264</b>. The totals agree to within one. The split does not — PR classifies roughly ten things as chests that Corundum calls pots or barrels. So trust the <i>total</i> and the <i>locations</i> here, and the in-game per-zone counter for the chest-versus-hidden split.</p></div>';
return h;
}
function render(){
renderHead();
document.getElementById("view").innerHTML =
tab==="route"?routeHTML():tab==="gear"?gearHTML():tab==="coli"?coliHTML():tab==="levels"?levelsHTML():
tab==="rages"?ragesHTML():notesHTML();
}
document.querySelector("nav").addEventListener("click",function(e){
var b=e.target.closest("button[data-tab]");if(!b)return;
tab=b.dataset.tab;
document.querySelectorAll("nav button").forEach(function(x){x.setAttribute("aria-selected",x===b);});
render();window.scrollTo(0,0);
});
document.getElementById("view").addEventListener("click",function(e){
var g=e.target.closest("[data-gate]");
if(g){open[g.dataset.gate]=!open[g.dataset.gate];render();return;}
var k=e.target.closest("[data-key]");
if(k){S.checked[k.dataset.key]=!S.checked[k.dataset.key];save();render();return;}
var u=e.target.closest("[data-uk]");
if(u){S.assign=S.assign||{};S.assign[u.dataset.uk]=u.dataset.uc;save();render();return;}
var a=e.target.closest("[data-act]");
if(a){
var io=document.getElementById("io2"),msg=document.getElementById("msg2");
var say=function(t){if(msg)msg.textContent=t;};
if(a.dataset.act==="export"){
var code=JSON.stringify({checked:S.checked,terra:S.terra,celes:S.celes,assign:S.assign,open:open,updated:S.updated});
if(io){io.value=code;io.select();}
if(navigator.clipboard&&navigator.clipboard.writeText){
navigator.clipboard.writeText(code).then(function(){say("Copied \u2014 paste it into Notes.");},
function(){say("Select the text above and copy it.");});}
else say("Select the text above and copy it.");
return;}
if(a.dataset.act==="import"){
try{var q=JSON.parse(io.value);S.checked=q.checked||{};S.terra=q.terra||"Magic";
S.celes=q.celes||"Strength";S.assign=q.assign||{};if(q.open)open=q.open;
S.updated=Date.now();save();render();
document.getElementById("msg2").textContent="Progress restored.";}
catch(err){say("That code could not be read.");}
return;}
if(a.dataset.act==="reset"){
if(!confirm("Clear all tracked progress?"))return;
S.checked={};save();render();return;}
if(a.dataset.act==="cloud-token"){
var tinp=document.getElementById("gistTokenInput");
var tval=tinp?tinp.value.trim():"";
if(!tval){say("Paste a token first.");return;}
setToken(tval);
say("Token saved \u2014 syncing\u2026");
cloudPush();
render();
return;}
if(a.dataset.act==="cloud-sync-now"){
if(pushTimer){clearTimeout(pushTimer);pushTimer=null;}
cloudPush();
return;}
if(a.dataset.act==="cloud-pull-now"){
syncFromCloud(true);
return;}
if(a.dataset.act==="cloud-disconnect"){
if(!confirm("Stop cloud backup on this device? The existing Gist backup is left untouched."))return;
setToken("");
CLOUD.status="idle";CLOUD.err="";
render();
return;}
if(a.dataset.act==="force-refresh"){
location.href=location.pathname+"?r="+Date.now();
return;}
}
var r=e.target.closest("[data-role]");
if(r){S[r.dataset.role]=r.dataset.val;save();render();}
});



if(!CANSTORE){note("Preview mode \u2014 ticks work but will not be saved.");}
if(LOADFAIL){note("Saved data could not be read. It has been kept as a copy \u2014 use Restore.");}
(function(){
var b=document.getElementById("hdrbk"); if(!b) return;
b.addEventListener("click",function(){
var code=JSON.stringify({checked:S.checked,terra:S.terra,celes:S.celes,assign:S.assign,open:open});
var done=function(t){var c=document.getElementById("count");
if(c){var old=c.textContent;c.textContent=t;setTimeout(function(){c.textContent=old;},2500);}};
if(navigator.clipboard&&navigator.clipboard.writeText){
navigator.clipboard.writeText(code).then(function(){done("Backup copied to clipboard");},
function(){tab="notes";render();done("Open Notes and copy the code");});
}else{tab="notes";render();done("Open Notes and copy the code");}
});
})();
render();
function syncFromCloud(manual){
if(manual)note("Checking cloud backup…");
cloudPull(function(remote,err){
if(remote){
var remoteUpdated=remote.updated||0;
if(remoteUpdated>(S.updated||0)){
S.checked=remote.checked||{};S.terra=remote.terra||"Magic";S.celes=remote.celes||"Strength";
S.assign=remote.assign||{};S.updated=remoteUpdated;
save();render();
note("Pulled newer progress from cloud.");
}else{
if((S.updated||0)>remoteUpdated)scheduleCloudPush();
if(manual)note("Already up to date.");
}
}else if(err){
if(manual)note("Could not reach cloud backup — check your connection.");
else if(gistId()&&!(S.updated>0))note("A cloud backup exists but couldn't be reached — check your connection.");
}
});
}
syncFromCloud(false);
/* Standalone Home Screen PWAs keep the page alive in the background instead
   of reloading it, so the normal load-time sync above never re-runs when you
   switch back in. Re-check on every return to foreground instead. */
function flushPendingPush(){
if(pushTimer){clearTimeout(pushTimer);pushTimer=null;cloudPush();}
}
document.addEventListener("visibilitychange",function(){
if(document.visibilityState==="visible")syncFromCloud(false);
else flushPendingPush();
});
window.addEventListener("pageshow",function(e){
if(e.persisted)syncFromCloud(false);
});
window.addEventListener("pagehide",flushPendingPush);
</script>
